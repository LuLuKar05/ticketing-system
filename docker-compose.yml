services:
    api:
        build: .
        ports:
            - '5000:5000'
        environment:
            PORT: '5000'
            # Postgres is the only engine. Inside the compose network the DB is reachable at
            # host `postgres`, port 5432 (the 5433 remap is only for host access).
            DATABASE_URL: 'postgres://ticket:ticket@postgres:5432/ticketing'
            # Comma-separated origins allowed to open a WebSocket connection. Empty = deny all.
            CORS_ORIGINS: ''
            # Set to "true" to log every SQL query (dev only).
            DB_LOGGING: 'false'
            # Redis backs the ephemeral shared state: rate-limit counters, WebAuthn challenges,
            # refresh-token families, recovery codes and waiting-room queue state.
            REDIS_URL: 'redis://redis:6379'
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        # Holds more than throwaway counters now: refresh-token families (30-day sessions), WebAuthn
        # challenges, recovery codes and queue state. So AOF persistence is ON — a Redis restart
        # without it would log every user out and drop everyone's place in the waiting room.
        command: ['redis-server', '--save', '', '--appendonly', 'yes']
        # Exposed on the host so a locally-run `npm start` (outside the compose network, where the
        # hostname `redis` doesn't resolve) can reach it at localhost:6379.
        ports:
            - '6379:6379'
        volumes:
            - ticket-redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ticket
            POSTGRES_PASSWORD: ticket
            POSTGRES_DB: ticketing
        # Exposed on host 5433 (5432 is often taken by a local Postgres) so `migration:generate`
        # /tests can reach it at localhost:5433. Inside the compose network it's still :5432.
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ticket -d ticketing']
            interval: 5s
            timeout: 3s
            retries: 5
        volumes:
            - ticket-pg:/var/lib/postgresql/data
        restart: unless-stopped
volumes:
    # Named volume, default (local) driver — empty object keeps strict YAML schemas happy.
    ticket-pg: {}
    ticket-redis: {}
