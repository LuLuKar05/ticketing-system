services:
    api:
        build: .
        ports:
            - '5000:5000'
        environment:
            PORT: '5000'
            # Comma-separated origins allowed to open a WebSocket connection. Empty = deny all.
            CORS_ORIGINS: ''
            # Set to "true" to log every SQL query (dev only).
            DB_LOGGING: 'false'
            # Redis backs the per-IP rate limiter (shared across instances).
            REDIS_URL: 'redis://redis:6379'
        volumes:
            # The SQLite file lives on a named volume so data survives container restarts/rebuilds.
            - ticket-db:/app/db
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        # A small in-memory store just for rate-limit counters (no persistence needed).
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ticket
            POSTGRES_PASSWORD: ticket
            POSTGRES_DB: ticketing
        # Exposed on host 5433 (5432 is often taken by a local Postgres) so `migration:generate`
        # /tests can reach it at localhost:5433. Inside the compose network it's still :5432.
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ticket -d ticketing']
            interval: 5s
            timeout: 3s
            retries: 5
        volumes:
            - ticket-pg:/var/lib/postgresql/data
        restart: unless-stopped
volumes:
    # Named volumes, default (local) driver — empty object keeps strict YAML schemas happy.
    ticket-db: {}
    ticket-pg: {}
