name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Node 26 — matches local dev, the tsconfig target, AND the Docker deploy image, so
            # "green in CI" means "green in prod". better-sqlite3 has a node-v147 linux prebuild.
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
                  cache: npm

            - run: npm ci

            # The full drift-catching gate — every check that keeps docs/format/types honest.
            - name: Typecheck (src)
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Build
              run: npm run build
            - name: Test
              run: npm test
