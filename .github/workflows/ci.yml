name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        # The test suite runs against a real Postgres (matches prod: row locks, SELECT FOR UPDATE).
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: ticket
                    POSTGRES_PASSWORD: ticket
                    POSTGRES_DB: ticketing_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U ticket -d ticketing_test"
                    --health-interval 5s --health-timeout 3s --health-retries 5
        env:
            TEST_DATABASE_URL: postgres://ticket:ticket@localhost:5432/ticketing_test
        steps:
            - uses: actions/checkout@v4

            # Node 26 — matches local dev, the tsconfig target, AND the Docker deploy image, so
            # "green in CI" means "green in prod". Tests run against the Postgres service below.
            - uses: actions/setup-node@v4
              with:
                  node-version: '26'
                  cache: npm

            - run: npm ci

            # The full drift-catching gate — every check that keeps docs/format/types honest.
            - name: Typecheck (src)
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Format check
              run: npm run format:check
            - name: Build
              run: npm run build
            - name: Test
              run: npm test
